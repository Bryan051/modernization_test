# ===== SMS 영업관리시스템 설정 =====
server.port=8080
server.context-path=/sms
server.session.timeout=1800

# 화면 (JSP)
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp
spring.http.encoding.charset=UTF-8
spring.http.encoding.force=true
spring.http.multipart.max-file-size=20MB
spring.http.multipart.max-request-size=25MB

# DB (값은 실행 환경의 환경변수로 넣는다)
spring.datasource.driver-class-name=com.mysql.jdbc.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.tomcat.max-active=30
spring.datasource.tomcat.validation-query=SELECT 1
spring.datasource.tomcat.test-on-borrow=true

# MyBatis (2019.08 이후)
mybatis.mapper-locations=classpath:mapper/**/*_SQL.xml
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.default-statement-timeout=30

# 메일 (미수금 안내 메일 발송용)
spring.mail.host=${MAIL_HOST}
spring.mail.port=25
spring.mail.default-encoding=UTF-8

# 2020.01 로그 레벨 조정 (운영 DEBUG 로그가 너무 많아서)
logging.level.root=INFO
logging.level.com.example.sms=DEBUG
